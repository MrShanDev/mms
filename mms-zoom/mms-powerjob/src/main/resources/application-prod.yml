oms:
  env: prod
  mongodb:
    enable: false
  instanceinfo:
    retention: 7
  container:
    retention:
      local: 7
      remote: -1
  instance:
    metadata:
      cache:
        size: 2048
  accurate:
    select:
      server:
        percentage: 50

spring:
  datasource:
    core:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: ${POWERJOB_DB_URL:jdbc:mysql://localhost:3306/mms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
      username: ${POWERJOB_DB_USERNAME:mms}
      password: ${POWERJOB_DB_PASSWORD:}
      maximum-pool-size: 20
      minimum-idle: 5
  boot:
    admin:
      client:
        enabled: true
        instance:
          service-host-type: IP
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:9001}
        username: ${SPRING_BOOT_ADMIN_USERNAME:admin}
        password: ${SPRING_BOOT_ADMIN_PASSWORD:}

