server:
  port: 7700

spring:
  application:
    name: MMS PowerJob
  profiles:
    active: @profiles.active@
  main:
    banner-mode: log
  jpa:
    open-in-view: false
  data:
    mongodb:
      repositories:
        type: none
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 0
      max-file-size: 209715200
      max-request-size: 209715200

logging:
  level:
    org.mongodb: warn
  config: classpath:logback-plus.xml

oms:
  transporter:
    active:
      protocols: AKKA,HTTP
    main:
      protocol: HTTP
  akka:
    port: 10086
  http:
    port: 10010
  table-prefix: pj_

management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/powerjob-console.log
  health:
    mongo:
      enabled: ${oms.mongodb.enable}
