<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <style>
    body { margin: 0; padding: 0; background: linear-gradient(155deg, #f5f0ff 0%, #faf5ff 50%, #f8fafc 100%); -webkit-font-smoothing: antialiased; }
    table { border-collapse: collapse; }
    .wrap { width: 100%; padding: 28px 12px 40px; }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(88, 28, 135, 0.1), 0 1px 0 rgba(255, 255, 255, 0.92) inset;
      border: 1px solid rgba(167, 139, 250, 0.25);
    }
    .bar { height: 4px; background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc); }
    .inner { padding: 36px 36px 28px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1e293b; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #7c3aed; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
    .brand { font-size: 22px; font-weight: 700; color: #4c1d95; text-align: center; letter-spacing: -0.02em; margin: 0 0 8px; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, #ede9fe, transparent); margin: 22px 0; }
    .lead { margin: 0 0 10px; font-size: 15px; line-height: 1.75; color: #334155; }
    .sub { margin: 0 0 18px; font-size: 14px; color: #64748b; line-height: 1.65; }
    .code-panel {
      text-align: center;
      padding: 22px 16px;
      margin: 6px 0 18px;
      border-radius: 12px;
      background: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 100%);
      border: 1px solid rgba(124, 58, 237, 0.3);
      box-shadow: 0 1px 4px rgba(76, 29, 149, 0.07);
    }
    .code-label { font-size: 12px; color: #5b21b6; margin-bottom: 10px; }
    .code {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: #6d28d9;
      margin: 0;
      padding-left: 0.32em;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .pill { display: inline-block; margin-top: 12px; padding: 4px 12px; font-size: 12px; color: #6b21a8; background: rgba(168, 85, 247, 0.15); border-radius: 999px; }
    .tips-title { font-size: 13px; font-weight: 600; color: #5b21b6; margin: 18px 0 8px; }
    .tips-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.85; color: #64748b; }
    .tips-list li { margin: 4px 0; }
    .banner {
      font-size: 13px;
      line-height: 1.65;
      color: #553c9a;
      padding: 12px 14px;
      margin-top: 4px;
      border-radius: 10px;
      background: rgba(237, 233, 254, 0.85);
      border: 1px solid rgba(196, 181, 253, 0.5);
    }
    .footer {
      padding: 20px 36px 28px;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
      color: #94a3b8;
      background: linear-gradient(180deg, #fafafa 0%, #f5f3ff 100%);
      border-top: 1px solid #ede9fe;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body>
<table class="wrap" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center">
      <table class="card" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">
        <tr><td><div class="bar"></div></td></tr>
        <tr>
          <td class="inner">
            <div class="eyebrow">EMAIL BINDING · 邮箱绑定</div>
            <div class="brand">#{appName}</div>
            <div class="divider"></div>
            <p class="lead">您好！</p>
            <p class="sub">您正在为账号绑定电子邮箱，请将以下验证码填入页面完成校验：</p>
            <div class="code-panel">
              <div class="code-label">邮箱验证码 · 请勿转发</div>
              <div class="code">#{code}</div>
              <div class="pill">约 #{expireMinutes} 分钟内有效</div>
            </div>
            <p class="tips-title">说明</p>
            <ul class="tips-list">
              <li>验证码在 <strong>#{expireMinutes} 分钟</strong> 内有效。</li>
              <li>如非本人操作，请忽略本邮件以保护账号。</li>
              <li>绑定成功后，可用于重要通知与安全相关操作。</li>
            </ul>
            <div class="banner">绑定邮箱能减少「无法找回密码」「收不到告警」等情况，推荐使用常用且安全的邮箱。</div>
          </td>
        </tr>
        <tr>
          <td class="footer">
            系统邮件 · 请勿直接回复<br />
            © #{year} #{appName}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
