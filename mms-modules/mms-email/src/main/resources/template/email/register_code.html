<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <style>
    body { margin: 0; padding: 0; background: linear-gradient(160deg, #e8eef9 0%, #f6f7fb 45%, #eef2ff 100%); -webkit-font-smoothing: antialiased; }
    table { border-collapse: collapse; }
    .wrap { width: 100%; padding: 28px 12px 40px; }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .bar { height: 4px; background: linear-gradient(90deg, #2563eb, #6366f1, #8b5cf6); }
    .inner { padding: 36px 36px 28px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #1e293b; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #64748b; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
    .brand { font-size: 22px; font-weight: 700; color: #0f172a; text-align: center; letter-spacing: -0.02em; margin: 0 0 6px; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, #e2e8f0, transparent); margin: 24px 0; }
    .lead { margin: 0 0 12px; font-size: 15px; line-height: 1.75; color: #334155; }
    .sub { margin: 0 0 20px; font-size: 14px; color: #64748b; line-height: 1.65; }
    .code-panel {
      text-align: center;
      padding: 22px 16px;
      margin: 8px 0 20px;
      border-radius: 12px;
      background: radial-gradient(circle at 20% 0%, rgba(99, 102, 241, 0.12), transparent 45%), radial-gradient(circle at 80% 100%, rgba(37, 99, 235, 0.1), transparent 42%), linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border: 1px solid rgba(99, 102, 241, 0.28);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    .code-label { font-size: 12px; color: #475569; margin-bottom: 10px; }
    .code {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: #1d4ed8;
      margin: 0;
      padding-left: 0.32em;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .pill { display: inline-block; margin-top: 12px; padding: 4px 12px; font-size: 12px; color: #4338ca; background: rgba(99, 102, 241, 0.12); border-radius: 999px; }
    .tips-title { font-size: 13px; font-weight: 600; color: #475569; margin: 0 0 10px; }
    .tips-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.85; color: #64748b; }
    .tips-list li { margin: 4px 0; }
    .footer {
      padding: 20px 36px 28px;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
      color: #94a3b8;
      background: #fafbfc;
      border-top: 1px solid #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body>
<table class="wrap" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center">
      <table class="card" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">
        <tr><td><div class="bar"></div></td></tr>
        <tr>
          <td class="inner">
            <div class="eyebrow">VERIFICATION · 注册验证</div>
            <div class="brand">#{appName}</div>
            <div class="divider"></div>
            <p class="lead">您好，欢迎使用 <strong>#{appName}</strong>。</p>
            <p class="sub">您正在进行 <strong style="color:#334155;">会员注册</strong>，请在下框内填入一次性验证码：</p>
            <div class="code-panel">
              <div class="code-label">您的验证码（6 位数字）</div>
              <div class="code">#{code}</div>
              <div class="pill">有效期内有效 · 请勿转告他人</div>
            </div>
            <p class="tips-title">安全提示</p>
            <ul class="tips-list">
              <li>验证码在 <strong>#{expireMinutes} 分钟</strong> 内有效，过期请重新获取。</li>
              <li>若您未曾发起注册，请忽略此邮件，无需做任何操作。</li>
              <li>请勿泄露验证码给他人，以免影响账号安全。</li>
            </ul>
          </td>
        </tr>
        <tr>
          <td class="footer">
            本邮件由系统发出，请勿直接回复。<br />
            © #{year} #{appName} · 保留所有权利
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
