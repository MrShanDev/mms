<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <style>
    body { margin: 0; padding: 0; background: linear-gradient(160deg, #fffbeb 0%, #fff7ed 42%, #f8fafc 100%); -webkit-font-smoothing: antialiased; }
    table { border-collapse: collapse; }
    .wrap { width: 100%; padding: 28px 12px 40px; }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(194, 65, 12, 0.1), 0 1px 0 rgba(255, 255, 255, 0.93) inset;
      border: 1px solid rgba(251, 191, 36, 0.35);
    }
    .bar { height: 4px; background: linear-gradient(90deg, #ea580c, #f97316, #fbbf24); }
    .inner { padding: 36px 36px 26px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1e293b; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #c2410c; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
    .brand { font-size: 22px; font-weight: 700; color: #9a3412; text-align: center; margin: 0 0 8px; letter-spacing: -0.02em; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, #fed7aa, transparent); margin: 22px 0; }
    .lead { margin: 0 0 12px; font-size: 15px; line-height: 1.75; color: #334155; }
    .order-shell {
      border-radius: 14px;
      margin: 6px 0 18px;
      padding: 4px;
      background: linear-gradient(125deg, rgba(251, 191, 36, 0.45), rgba(249, 115, 22, 0.15));
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.08);
    }
    .order-inner {
      border-radius: 12px;
      background: linear-gradient(180deg, #fffbeb 0%, #ffffff 32%);
      border: 1px solid #fef3c7;
      overflow: hidden;
    }
    .order-head {
      padding: 14px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #7c2d12;
      background: rgba(255, 237, 213, 0.95);
      border-bottom: 1px solid rgba(251, 191, 36, 0.5);
      letter-spacing: 0.04em;
    }
    .row {
      padding: 12px 18px;
      border-bottom: 1px solid #fff7ed;
      font-size: 13px;
      line-height: 1.55;
      color: #334155;
    }
    .row:last-child { border-bottom: none; }
    .k { color: #64748b; font-size: 12px; }
    .v { color: #0f172a; font-weight: 600; word-break: break-all; padding-top: 4px; }
    .message {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      color: #475569;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      margin-bottom: 6px;
    }
    .footer {
      padding: 20px 36px 28px;
      text-align: center;
      font-size: 12px;
      line-height: 1.75;
      color: #94a3b8;
      background: linear-gradient(180deg, #fffbeb 0%, #fafafa 100%);
      border-top: 1px solid #fef3c7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body>
<table class="wrap" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center">
      <table class="card" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">
        <tr><td><div class="bar"></div></td></tr>
        <tr>
          <td class="inner">
            <div class="eyebrow">ORDER UPDATE · 订单动态</div>
            <div class="brand">#{appName}</div>
            <div class="divider"></div>
            <p class="lead">尊敬的 <strong>#{username}</strong>：</p>
            <p class="lead" style="margin-top:-8px;">您有一笔订单状态已<strong>发生变化</strong>，摘要如下，便于留存与核对：</p>
            <div class="order-shell"><div class="order-inner">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="order-head">订单快照 · Snapshot</td>
                </tr>
                <tr>
                  <td class="row"><div class="k">订单编号</div><div class="v">#{orderNo}</div></td>
                </tr>
                <tr>
                  <td class="row"><div class="k">订单状态</div><div class="v">#{orderStatus}</div></td>
                </tr>
                <tr>
                  <td class="row"><div class="k">订单金额</div><div class="v">¥#{orderAmount}</div></td>
                </tr>
                <tr>
                  <td class="row"><div class="k">更新时间</div><div class="v">#{updateTime}</div></td>
                </tr>
              </table>
            </div></div>
            <div class="message">#{orderMessage}</div>
          </td>
        </tr>
        <tr>
          <td class="footer">
            本邮件仅供参考 · 系统发送请勿直接回复<br />
            © #{year} #{appName}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
