# 生产机密示例：复制为「运行目录」下 config/application-prod-secret.yml（与 mms-admin.jar 同级）
# 该文件已加入 .gitignore，换版本只替换 jar，无需再改密钥。
#
# 亦可不设此文件，改用环境变量，例如：
#   DB_JDBC_URL、DB_USERNAME、SPRING_DATASOURCE_PASSWORD、SPRING_DATASOURCE_DYNAMIC_PUBLIC_KEY、
#   SPRING_BOOT_ADMIN_PASSWORD、SPRING_REDIS_PASSWORD 等（见 application-prod.yml）。
#
# 注意：必须有顶层 spring:，否则不会绑定到 spring.datasource / spring.data.redis，线上将出现连库密码错误或未解密。

spring:
  datasource:
    dynamic:
      # GeneratePassword 选「1」时控制台输出的 publicKey，整段粘到下一行引号内；与 ENC 密文需为同一密钥对
      public-key: "MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJygUOzsBGKtcagm9Xv6vAgedRte7qyiY7B56xBqXL9Nx4njQuDJ10oIBEG/Ze/x2yjvub6Xw/SThwr+25PStPECAwEAAQ=="
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driverClassName: com.mysql.cj.jdbc.Driver
          # 以下五项均可按需填写：可全部明文，或 url/username/password 改用 GeneratePassword 生成的 ENC（与 public-key 同对）
          # 也可整段留空/删行，改在环境变量中配置 DB_JDBC_URL、DB_USERNAME、SPRING_DATASOURCE_PASSWORD
          url: ENC()
          username: ENC(mhKvCZIwiNudSKsc8EkzDHYPF0eoXgndX419aIJwNNL2WYRrmdZnzGszMb59PDlYrbw45MeFSAwsHoKS+5v2pw==)
          password: ENC(L3XWvDAU+EnZHuUe4lFJ489ZkAWxhEMsfRhC4FdiW3blEx3wnq9T6687iYFOpO1JWQGEWpSvyWedLSftPQ4LJA==)

  data:
    redis:
      # Redis 地址：单机填 host；若用集群/哨兵请改 application-prod.yml 对应段或查阅 Redisson 文档
      host: "localhost"
      port: 6379
      database: 5
      # 无密码可写空字符串 ""
      password: "123456"
      timeout: 100s
      ssl:
        enabled: false
