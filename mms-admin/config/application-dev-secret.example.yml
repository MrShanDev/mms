# 模板：复制为本目录下 application-dev-secret.yml（勿提交真值；真文件已被 .gitignore）
# 与 application-dev.yml 文末 spring.config.import 一致，多路径之一为 ./mms/mms-admin/config/…
# 聚合仓另有 script/config/application-dev-secret.example.yml，可任选一处复制。
#
# application-dev.yml 中勿再写 public-key / master.url/username/password / Redis / Boot Admin 密码，
# 否则同文件靠后文档会覆盖 import，ENC 不生效。

spring:
  boot:
    admin:
      client:
        password: "123456"

  datasource:
    dynamic:
      # 与下方 ENC 同密钥对；GeneratePassword 控制台输出的 publicKey
      public-key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJpocwyy7m8F8tAUeMgn6GOU404nYeL+yRnKG3JL7IZghb4N9ew9v5O6hJ+gZFlXnGiMjlo5dx5/tpArvtbRwGkCAwEAAQ==
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
          username: root
          # 由 GeneratePassword.java 生成，须与 public-key 匹配（示例密文仅作格式演示）
          password: ENC(bOk3dciU9b7DePoU9figF1HAFz+BcAtoW9IvCDqQm8S8HwwwX/4LRhBWX9rAfCEA9iehbZvqfZEC1F1BCa9pgA==)

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: "123456"
      timeout: 100s
      ssl:
        enabled: false
