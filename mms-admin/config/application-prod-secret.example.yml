# 模板：复制为本目录下 application-prod-secret.yml（勿提交真值；真文件已被 .gitignore）
# 与 application-prod.yml 文末 spring.config.import 一致（通常为 ./config/application-prod-secret.yml，与 jar 同级）
# 聚合仓另有 script/config/application-prod-secret.example.yml；部署可参考 script/docker 中 config 挂载。
# GeneratePassword 选「1」时可在 script/config 生成 dynamic-datasource-rsa.keys，并回填本文件 public-key。
#
# application-prod.yml 中勿再写 public-key / master.url/username/password / Redis / Boot Admin 密码，
# 否则同文件靠后文档会覆盖 import，ENC 不生效。

spring:
  boot:
    admin:
      client:
        password: "请替换"

  datasource:
    dynamic:
      # GeneratePassword 选「1」时控制台输出的 publicKey，整段粘到下一行引号内
      public-key: ""
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driverClassName: com.mysql.cj.jdbc.Driver
          # GeneratePassword 写入 url/username/password 时自动带 ENC(...)；需与 public-key 同对
          url: jdbc:mysql://YOUR_DB_HOST:YOUR_DB_PORT/YOUR_DB_NAME?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
          username: "YOUR_DB_USERNAME"
          password: "YOUR_DB_PASSWORD或ENC(...)"

  data:
    redis:
      host: "YOUR_REDIS_HOST"
      port: 6379
      database: 0
      password: "YOUR_REDIS_PASSWORD"
      timeout: 100s
      ssl:
        enabled: false
