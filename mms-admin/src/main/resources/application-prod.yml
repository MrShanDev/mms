# =============================================================================
# mms-admin · prod 环境（叠加 application.yml；同名键覆盖主配置）
# 分段：demo → powerjob → Spring Boot Admin → Actuator → 数据源/Redis →
#       redisson → websocket → mms.cors → swagger/springdoc → 日志 →
#       mybatis-plus → spring.config.import（外置机密，最后加载）
# =============================================================================

# 演示模式（完整项见主配置 application.yml；与 script/config 约定一致）
demo:
  mode:
    enabled: false                        # 生产关闭；主配置默认为 true

# spring.config.import（application-prod-secret.yml）在文件末尾加载，可覆盖上文数据源/Redis 等默认值

# ---------------------------------------------------------------------------
# PowerJob Worker
# ---------------------------------------------------------------------------
--- # PowerJob Worker
power-job:
  worker:
    # 如何开启调度中心请查看文档教程
    enabled: false
    # 需要先在 power-job 登录页执行应用注册后才能使用
    app-name: mms
    max-appended-wf-context-length: 4096
    max-result-length: 4096
    # 端口 = 字符 2 + 主应用 server.port（如 8080 → 28080），避免集群与主端口冲突
    port: 2${server.port}
    protocol: http
    server-address: 127.0.0.1:7700
    store-strategy: disk

# ---------------------------------------------------------------------------
# Spring Boot Admin（Client）
# ---------------------------------------------------------------------------
--- # Spring Boot Admin（Client）
spring:
  boot:
    admin:
      client:
        enabled: false                    # 启用 / 禁用 Client
        instance:
          service-host-type: IP
        # client.password 等可放在 application-prod-secret.yml（由文末 import 覆盖）
        url: http://localhost:9001        # 监控服务端地址
        username: admin                   # 账号
        password: ""                      # 密码占位；外置机密可覆盖

# ---------------------------------------------------------------------------
# Actuator（生产仅暴露必要端点）
# ---------------------------------------------------------------------------
--- # Actuator
management:
  endpoints:
    enabled-by-default: true              # 暴露端点元数据
    web:
      exposure:
        include: health,info              # 生产收窄暴露范围
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

# ---------------------------------------------------------------------------
# 动态数据源（dynamic-datasource）
# 参考：https://www.kancloud.cn/tracy5546/dynamic-datasource/2344619
