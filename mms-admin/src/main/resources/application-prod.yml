  data:
    redis:
      host: localhost
      port: 6379
      database: 2
      password: ""
      timeout: 100s
      ssl:
        enabled: false

# ---------------------------------------------------------------------------
# Redisson
# ---------------------------------------------------------------------------
--- # Redisson
redisson:
  keyPrefix:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    clientName: mmsAdmin
    connectionMinimumIdleSize: 8
    connectionPoolSize: 32
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50

# ---------------------------------------------------------------------------
# WebSocket
# ---------------------------------------------------------------------------
--- # WebSocket
websocket:
  allowed-origins: "*"

# ---------------------------------------------------------------------------
# MMS CORS
# ---------------------------------------------------------------------------
--- # MMS CORS
mms:
  cors:
    allowed-origins: "*"
    allowed-headers: "*"
    allowed-methods: "*"
    allow-credentials: true
    max-age: 1800

# ---------------------------------------------------------------------------
# Swagger / springdoc（生产关闭对外文档）
# ---------------------------------------------------------------------------
--- # Swagger 开关
swagger:
  enabled: false

--- # springdoc（与 swagger.enabled: false 对齐）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
--- # 日志
logging:
  level:
    com.sxpcwlkj: @logging.level@
    org.springframework: warn
  config: classpath:logback-spring.xml

mms:
  logging:
    plugin-sift-min-level: INFO

# ---------------------------------------------------------------------------
# MyBatis-Plus（生产关闭 SQL 标准输出）
# ---------------------------------------------------------------------------
--- # MyBatis-Plus（生产）
mybatis-plus:
  configuration:
    logImpl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ---------------------------------------------------------------------------
# 外置机密（最后加载，覆盖上文同名项）
# ---------------------------------------------------------------------------
--- # 外置机密（spring.config.import）
# 文件路径：运行目录 ./config/application-prod-secret.yml（optional：不存在则跳过）
# 模板参考：script/config/application-prod-secret.example.yml → 复制为 application-prod-secret.yml
# 典型内容：数据源、Redis、Spring Boot Admin 密码等
spring:
  config:
    import: optional:file:./config/application-prod-secret.yml
