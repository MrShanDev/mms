# =============================================================================
# mms-admin · dev 环境（叠加 application.yml；同名键覆盖主配置）
# 分段：demo → powerjob → Spring Boot Admin → management → 数据源/Redis →
#       redisson → logging → spring.config.import（外置机密，最后加载）
# =============================================================================

# 演示模式（与 script/config 约定一致）
demo:
  mode:
    enabled: false

# spring.config.import（application-dev-secret.yml）在文件末尾加载，可覆盖上文数据源等默认值

# ---------------------------------------------------------------------------
# PowerJob Worker
# ---------------------------------------------------------------------------
--- # PowerJob Worker
powerjob:
  worker:
    # 如何开启调度中心请查看文档教程
    enabled: false
    # 需要先在 powerjob 登录页执行应用注册后才能使用
    app-name: mms
    max-appended-wf-context-length: 4096
    max-result-length: 4096
    # 端口 = 字符 2 + 主应用 server.port（如 8080 → 28080），避免集群与主端口冲突
    port: 2${server.port}
    protocol: http
    server-address: 127.0.0.1:7700
    store-strategy: disk

# ---------------------------------------------------------------------------
# Spring Boot Admin（Client）
# ---------------------------------------------------------------------------
--- # Spring Boot Admin（Client）
spring:
  boot:
    admin:
      client:
        enabled: false                    # 启用 / 禁用 Client
        instance:
          service-host-type: IP
        # client.password 可放在 application-dev-secret.yml（由文末 import 加载）
        url: http://localhost:9001        # 监控服务端地址
        username: admin                   # 账号
        password: 123456                  # 密码（示例；生产勿提交真实密码）

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
--- # Actuator
management:
  endpoints:
    enabled-by-default: true              # 暴露端点元数据
    web:
      exposure:
        include: '*'                      # 以 Web 方式暴露的端点集合
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

# ---------------------------------------------------------------------------
# 动态数据源（dynamic-datasource）
# 参考：https://www.kancloud.cn/tracy5546/dynamic-datasource/2344619
# ---------------------------------------------------------------------------
--- # 动态数据源（dynamic-datasource）
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      # 性能分析插件（有损耗，不建议生产长期开启）
      p6spy: true
      # 默认数据源或数据源组名
      primary: master
      # 严格模式：匹配不到数据源则报错
      strict: true
      # 公钥、master.url / username / password 等敏感项可迁至 application-dev-secret.yml
      public-key: "公钥==密钥"
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
          username: ENC(用户名)
          password: ENC(密钥)
#          # 从库示例（按需取消注释）
#        slave:
#          lazy: true
#          type: com.zaxxer.hikari.HikariDataSource
#          driverClassName: com.mysql.cj.jdbc.Driver
#          url: jdbc:mysql://localhost:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
#          username: root
#          password: 123456
#        oracle:
#          type: com.zaxxer.hikari.HikariDataSource
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//localhost:1521/XE
#          username: ROOT
#          password: root
#          hikari:
#            connectionTestQuery: SELECT 1 FROM DUAL
#        postgres:
#          type: com.zaxxer.hikari.HikariDataSource
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#          username: root
#          password: root
#        sqlserver:
#          type: com.zaxxer.hikari.HikariDataSource
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
#          username: SA
#          password: root
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲连接数
        minIdle: 10
        # 获取连接等待超时（毫秒）
        connectionTimeout: 30000
        # 校验超时（毫秒）
        validationTimeout: 5000
        # 空闲连接最大存活（毫秒，默认约 10 分钟）
        idleTimeout: 600000
        # 连接最长生命周期（毫秒，0 表示不限制；默认约 30 分钟）
        maxLifetime: 1800000
        # 连接探活 SQL
        connectionTestQuery: SELECT 1
        # 探活间隔（毫秒）
        keepaliveTime: 30000
        # 连接泄漏检测（毫秒，0 关闭）
        leakDetectionThreshold: 0

  # Redis（单机示例；与 secret 外置文件可二选一或叠加覆盖）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: "123456"
      timeout: 100s
      ssl:
        enabled: false

# ---------------------------------------------------------------------------
# Redisson
# ---------------------------------------------------------------------------
--- # Redisson
redisson:
  # Redis key 前缀（空则不加前缀）
  keyPrefix:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    clientName: mmsAdmin
    connectionMinimumIdleSize: 8
    connectionPoolSize: 32
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
--- # 日志
logging:
  level:
    # 业务包：开发常用 info；联调 SQL / 框架细节时可改为 debug（日志量显著增加）
    com.sxpcwlkj: info
    org.springframework: warn
  # 使用 classpath 内 logback.xml（与仓库 resources 中文件一致）
  config: classpath:logback.xml

# ---------------------------------------------------------------------------
# 外置机密（最后加载，覆盖上文同名项）
# ---------------------------------------------------------------------------
--- # 外置机密（spring.config.import）
# 路径均相对「进程工作目录」；optional：不存在则跳过。按顺序加载，后者覆盖前者同名键。
# - 聚合仓根启动：./mms/mms-admin/config/application-dev-secret.yml
# - mms 子目录启动：./mms-admin/config/application-dev-secret.yml
# - 与 jar 同级惯例：./config/application-dev-secret.yml（放最后，便于本地覆盖）
# 模板：script/config/application-dev-secret.example.yml
spring:
  config:
    import:
      - optional:file:./mms/mms-admin/config/application-dev-secret.yml
      - optional:file:./mms-admin/config/application-dev-secret.yml
      - optional:file:./config/application-dev-secret.yml
