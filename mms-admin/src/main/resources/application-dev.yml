--- # powerjob 配置
powerjob:
  worker:
    # 如何开启调度中心请查看文档教程
    enabled: false
    # 需要先在 powerjob 登录页执行应用注册后才能使用
    app-name: mms
    max-appended-wf-context-length: 4096
    max-result-length: 4096
    # 28080 端口 随着主应用端口飘逸 避免集群冲突
    port: 2${server.port}
    protocol: http
    server-address: 127.0.0.1:7700
    store-strategy: disk

--- # Spring Boot Admin
spring:
  boot:
    admin:
      client:
        enabled: false                 #启用/禁用
        instance:
          service-host-type: IP
        # Spring Boot Admin
        url: http://localhost:9001    #监控服务器端地址
        username: admin               #账号
        password: 123456              #密码

