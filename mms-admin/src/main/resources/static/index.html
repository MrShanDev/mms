<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能对话助手 | AI Chat</title>

    <!-- 依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- 新增侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>历史对话</h3>
            <button class="toggle-sidebar" onclick="toggleSidebar()">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>
    <div class="main-content">
        <div class="header">
            <h1 onclick="toggleSidebar()"><i class="fas fa-robot"></i>智能对话助手</h1>
            <p>支持文件分析和多轮对话</p>
        </div>
        <div class="chat-container" id="chatBox">
            <div class="message bot-message">
                🤖 您好！我可以处理文本和文件内容，请上传资料或输入问题
            </div>
        </div>
        <div class="input-section">
            <div class="tool-box">
                <div class="tool-left">
                    <div class="input-group">
                        <input type="text" id="userInput" placeholder="输入您的问题...">
                        <div class="upload-area" id="uploadArea">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>添加附件</span>
                            <input type="file" id="fileInput" multiple hidden>
                        </div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button id="newChatBtn" onclick="startNewSession()">
                        <i class="fas fa-comment-medical"></i>
                        <span>新对话</span>
                    </button>
                    <button id="sendBtn" onclick="handleSend()">
                        <i class="fas fa-paper-plane"></i>
                        <span>发送</span>
                    </button>
                    <button id="stopBtn" onclick="stopConversation()">
                        <i class="fas fa-stop"></i>
                        <span>停止</span>
                    </button>
                </div>
            </div>
            <div class="update-tool">
                <div class="file-preview" id="filePreview"></div>
            </div>
        </div>

        <div class="copy-toast" id="copyToast">内容已复制</div>
        <div class="loading" id="loading">
            <div class="loading-wave">
                <div style="animation-delay: 0s"></div>
                <div style="animation-delay: 0.2s"></div>
                <div style="animation-delay: 0.4s"></div>
                <div style="animation-delay: 0.6s"></div>
            </div>
        </div>
    </div>
</div>
<script>
    // 新增历史记录管理功能
    let chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];

    // 初始化时渲染历史记录
    function renderHistoryList() {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = chatHistory.map(session => `
            <div class="session-item ${session.id === currentSessionId ? 'active' : ''}"
                 onclick="switchSession('${session.id}')">
                <div class="session-title">${session.title || '新对话'}</div>
                <div class="session-info">
                    <span>${new Date(session.time).toLocaleDateString()}</span>
                    <span>#${session.id.slice(-4)}</span>
                </div>
            </div>
        `).join('');
    }

    // 切换会话
    function switchSession(sessionId) {
        const session = chatHistory.find(s => s.id === sessionId);
        if (!session) return;

        currentSessionId = sessionId;
        localStorage.setItem('chatSessionId', sessionId);

        // 清空当前聊天并加载历史消息
        chatBox.innerHTML = session.messages.map(msg => `
            <div class="message ${msg.role === 'user' ? 'user-message' : 'bot-message'}">
                ${marked.parse(msg.content)}
            </div>
        `).join('');

        // 更新历史列表状态
        renderHistoryList();
        scrollToBottom();
    }
    let currentSessionId = generateSessionId();
    // 生成唯一sessionId
    function generateSessionId() {
        const storedId = localStorage.getItem('chatSessionId');
        if (storedId) return storedId;

        const newId = 'session-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chatSessionId', newId);
        return newId;
    }
    // 新对话按钮功能
    function startNewSession() {
        if (controller) controller.abort();

        // 保存当前会话
        saveCurrentSession();

        // 创建新会话
        currentSessionId = generateSessionId();
        localStorage.setItem('chatSessionId', currentSessionId);

        // 初始化新会话数据
        chatHistory.unshift({
            id: currentSessionId,
            title: '新对话',
            time: new Date().toISOString(),
            messages: []
        });

        // 清空界面
        chatBox.innerHTML = `
            <div class="message bot-message">
                🤖 新对话已创建！我可以处理文本和文件内容，请上传资料或输入问题
            </div>`;

        files = [];
        filePreview.innerHTML = '';
        fileInput.value = '';
        toggleUIState(false);

        // 更新历史记录
        renderHistoryList();
        localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    }

    // 新增保存会话函数
    function saveCurrentSession() {
        const messages = Array.from(chatBox.children).map(msg => ({
            role: msg.classList.contains('user-message') ? 'user' : 'bot',
            content: msg.innerHTML
        }));

        const sessionIndex = chatHistory.findIndex(s => s.id === currentSessionId);
        if (sessionIndex >= 0) {
            chatHistory[sessionIndex] = {
                ...chatHistory[sessionIndex],
                messages,
                time: new Date().toISOString()
            };
        }
        localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    }
    // 配置 Markdown 解析
    marked.setOptions({
        highlight: (code, lang) => Prism.highlight(code, Prism.languages[lang] || Prism.languages.autoit, lang),
        langPrefix: 'language-'
    });

    // DOM 元素
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const filePreview = document.getElementById('filePreview');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const loading = document.getElementById('loading');

    // 全局变量
    let controller = null;
    let files = [];

    // 初始化事件监听
    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = 'var(--border)';
        files = Array.from(e.dataTransfer.files);
        renderFilePreviews();
    });
    fileInput.addEventListener('change', (e) => {
        files = Array.from(e.target.files);
        renderFilePreviews();
    });

    // 文件预览渲染
    function renderFilePreviews() {
        filePreview.innerHTML = '';
        files.forEach((file, index) => {
            const preview = document.createElement('div');
            preview.className = 'file-card';

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `
                            <img src="${e.target.result}" alt="${file.name}" style="max-width: 40px">
                            <div>${file.name}</div>
                            <div class="remove-file" onclick="removeFile(${index})">&times;</div>
                        `;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = `
                        <i class="fas fa-file"></i>
                        <div>${file.name}</div>
                        <div class="remove-file" onclick="removeFile(${index})">&times;</div>
                    `;
            }
            filePreview.appendChild(preview);
        });
    }

    // 移除文件
    function removeFile(index) {
        files.splice(index, 1);
        fileInput.value = '';
        renderFilePreviews();
    }

    // 发生对话处理
    async function handleSend() {
        const prompt = userInput.value.trim();
        if (!prompt && files.length === 0) return;

        // 更新会话标题（使用第一个问题作为标题）
        if (prompt) {
            const sessionIndex = chatHistory.findIndex(s => s.id === currentSessionId);
            if (sessionIndex >= 0 && !chatHistory[sessionIndex].title) {
                chatHistory[sessionIndex].title = prompt.substring(0, 50);
                renderHistoryList();
            }
        }

        // 更新UI状态
        toggleUIState(true);
        userInput.value = '';

        // 添加用户消息
        if (prompt) addMessage(prompt, true);
        if (files.length > 0) {
            addMessage(`📎 上传文件：${files.map(f => f.name).join(', ')}`, true);
        }

        try {
            controller = new AbortController();
            const formData = new FormData();
            formData.append('message', prompt);
            formData.append('sessionId', currentSessionId);
            files.forEach(file => formData.append('files', file));

            const response = await fetch('/api/chat', {
                method: 'POST',
                body: formData,
                signal: controller.signal
            });

            await processStreamResponse(response);
        } catch (err) {
            if (err.name !== 'AbortError') {
                addMessage(`⚠️ 请求失败: ${err.message}`, false);
            }
        } finally {
            toggleUIState(false);
            files = [];
            filePreview.innerHTML = '';
        }
    }

    // 处理流式响应
    async function processStreamResponse(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullResponse = '';

        while (true) {
            const { done, value } = await reader.read();
            console.log("OK"+done)
            if(done){
                const lastMsg = document.querySelector('.bot-message:last-child');
                lastMsg.dataset.rawContent = lastMsg.textContent;
                lastMsg.appendChild(createCopyBtn(lastMsg));
                break;
            }
            buffer += decoder.decode(value, { stream: true });
            const chunks = buffer.split('\n\n');

            for (let i = 0; i < chunks.length - 1; i++) {
                const eventData = chunks[i].split('\n')
                    .find(line => line.startsWith('data:'))
                    ?.replace('data:', '').trim();

                if (eventData) {
                    try {
                        const data = JSON.parse(eventData);
                        fullResponse += data.content;
                        const lastMsg = document.querySelector('.bot-message:last-child');
                        if (lastMsg) {
                            lastMsg.innerHTML =marked.parse(fullResponse);
                            Prism.highlightAllUnder(lastMsg);
                        } else {
                            addMessage(fullResponse);
                        }
                        scrollToBottom();
                    } catch(e) {
                        console.error('解析错误:', e);
                    }
                }
            }
            buffer = chunks[chunks.length - 1];
        }
    }

    // 停止对话
    function stopConversation() {
        if (controller) {
            controller.abort();
            addMessage('⏹️ 对话已停止', false);
            toggleUIState(false);
        }
    }
    // 思考状态管理
    function toggleUIState(isProcessing) {
        sendBtn.style.display = isProcessing ? 'none' : 'flex';
        stopBtn.style.display = isProcessing ? 'flex' : 'none';
        loading.style.display = isProcessing ? 'block' : 'none';
        uploadArea.style.pointerEvents = isProcessing ? 'none' : 'auto';

        if(isProcessing) {
            document.querySelectorAll('.loading-wave div').forEach((bar, index) => {
                bar.style.animationDelay = `${index * 0.2}s`;
            });
        }
    }
    // 添加消息
    function addMessage(content, isUser = false) {
        // 创建消息容器
        const message = document.createElement('div');
        message.className = `message ${isUser ? 'user-message' : 'bot-message'}`;

        // 创建内容包装器
        const contentWrapper = document.createElement('div');
        contentWrapper.className = 'message-wrapper';

        // 创建内容容器
        const contentContainer = document.createElement('div');
        contentContainer.className = 'message-content';
        contentContainer.innerHTML = marked.parse(content);

        // 保存原始文本
        message.dataset.rawContent = content;

        // 组装元素
        contentWrapper.appendChild(contentContainer);
        contentWrapper.appendChild(createCopyBtn(message)); // 将复制按钮添加到内容包装器
        message.appendChild(contentWrapper);


        // 添加到聊天框
        chatBox.appendChild(message);

        // 触发动画
        setTimeout(() => {
            message.style.opacity = '1';
            message.style.transform = 'translateY(0)';
        }, 10);

        // 高亮代码
        Prism.highlightAllUnder(message);
        scrollToBottom();
    }
    //添加复制按钮
    function createCopyBtn(message){
        // 创建复制按钮
        const copyBtn = document.createElement('div');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML = `
        <i class="fas fa-copy"></i>
        <span class="copy-text">复制</span>
    `;
        // 添加点击事件委托
        copyBtn.onclick = (e) => {
            e.stopPropagation();
            copyMessageContent(message);
        };
        return copyBtn;
    }
    // 侧边栏切换
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
        document.querySelector('.toggle-sidebar i').classList.toggle('fa-chevron-right');
    }
    // 自动滚动
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    // 新增复制功能
    function copyMessageContent(messageElement) {
        const content = messageElement.dataset.rawContent;
        navigator.clipboard.writeText(content).then(() => {
            showCopyToast();
        }).catch(err => {
            console.error('复制失败:', err);
        });
    }
    // 显示复制成功提示
    function showCopyToast() {
        const toast = document.getElementById('copyToast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
    // 移动端优化：调整复制按钮显示
    function adjustCopyButton() {
        const isMobile = window.innerWidth <= 768;
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.style.opacity = isMobile ? '1' : '';
            btn.querySelector('.copy-text').style.display = isMobile ? 'none' : 'inline';
        });
    }
    // 在页面加载时添加欢迎消息
    window.addEventListener('DOMContentLoaded', () => {
        chatBox.innerHTML = `
            <div class="message bot-message">
                🤖您好！‘ ${currentSessionId} ’  欢迎回来我可以处理文本和文件内容，请上传资料或输入问题！
            </div>
        `;
        if (chatHistory.length === 0) {
            chatHistory.push({
                id: currentSessionId,
                title: '欢迎使用',
                time: new Date().toISOString(),
                messages: []
            });
        }
        renderHistoryList();
    });
    // 回车发送
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
    // 初始化时执行
    window.addEventListener('DOMContentLoaded', adjustCopyButton);
    window.addEventListener('resize', adjustCopyButton);
    // 在页面卸载前保存当前会话
    window.addEventListener('beforeunload', () => {
        saveCurrentSession();
    });
</script>

</body>
</html>
