# 演示模式配置（与 script/config 约定一致，覆盖主配置 application.yml）
demo:
  mode:
    enabled: false

--- # power-job 配置
power-job:
  worker:
    # 如何开启调度中心请查看文档教程
    enabled: false
    # 需要先在 power-job 登录页执行应用注册后才能使用
    app-name: mms
    max-appended-wf-context-length: 4096
    max-result-length: 4096
    # 28080 端口 随着主应用端口飘逸 避免集群冲突
    port: 28080
    protocol: http
    server-address: 127.0.0.1:7700
    store-strategy: disk

--- # Spring Boot Admin
spring:
  boot:
    admin:
      client:
        enabled: false                 #启用/禁用
        instance:
          service-host-type: IP
        url: http://localhost:9001    #监控服务器端地址
        username: admin               #账号
        password: 123456              #密码（本地 profile 不外置 import，直接写在此处）

--- #配置项目的数据源 https://www.kancloud.cn/tracy5546/dynamic-datasource/2344619
--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: true
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      # 本地：明文连接，不使用 ENC（勿提交真实生产密码）
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
          username: root
          password: 123456
#          # 从库数据源
#        slave:
#          lazy: true
#          type: com.zaxxer.hikari.HikariDataSource
#          driverClassName: com.mysql.cj.jdbc.Driver
#          url: jdbc:mysql://localhost:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
#          username: root
#          password: 123456
      #        oracle:
      #          type: com.zaxxer.hikari.HikariDataSource
      #          driverClassName: oracle.jdbc.OracleDriver
      #          url: jdbc:oracle:thin:@//localhost:1521/XE
      #          username: ROOT
      #          password: root
      #          hikari:
      #            connectionTestQuery: SELECT 1 FROM DUAL
      #        postgres:
      #          type: com.zaxxer.hikari.HikariDataSource
      #          driverClassName: org.postgresql.Driver
      #          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
      #          username: root
      #          password: root
      #        sqlserver:
      #          type: com.zaxxer.hikari.HikariDataSource
      #          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
      #          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
      #          username: SA
      #          password: root
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 连接测试query（配置检测连接是否有效）
        connectionTestQuery: SELECT 1
        # 多久检查一次连接的活性
        keepaliveTime: 30000
        # 连接泄漏检测（毫秒，0 表示关闭）
        leakDetectionThreshold: 0

--- # Redis配置（本地写在本文件；与 script/config/application-dev-secret.yml 可对照）
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: "123456"
      timeout: 100s
      ssl:
        enabled: false

--- # Redis 扩展工具
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称
    clientName: mmsAdmin
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # CORS 配置
mms:
  cors:
    allowed-origins: "*"
    allowed-headers: "*"
    allowed-methods: "*"
    allow-credentials: true
    max-age: 1800

--- # Actuator 监控端点的配置项
management:
  endpoints:
    enabled-by-default: true #暴露所有端点信息
    web:
      exposure:
        include: '*' #以web方式暴露
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # Spring Boot Admin
spring:
  boot:
    admin:
      client:
        url: http://localhost:9001    # Spring Boot Admin 监控服务器端地址

--- # 日志配置
logging:
  level:
    # 与父 POM logging.level 一致（local 默认 debug；注释中勿写过滤占位符以免被 Maven 替换）
    com.sxpcwlkj: @logging.level@
    # 插件 API / 宿主 / server：安装与生命周期排错（比业务包更细）
    com.sxpcwlkj.plugin: trace
    org.springframework: warn
  config: classpath:logback-spring.xml

mms:
  logging:
    # 插件按 MDC 写入 logs/plugins/*.log 时的 Threshold（local 放宽，便于看 DEBUG）
    plugin-sift-min-level: DEBUG


# 企业微信机器人配置
wechat:
  bot:
    enabled: true  # 是否启用微信机器人
    webhook-url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_WEBHOOK_KEY"
    msg-type: "markdown"  # 消息类型：text 或 markdown
