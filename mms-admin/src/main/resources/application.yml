    url: https://wss.lke.cloud.tencent.com/v1/qbot/chat/sse # Ollama默认地址 http://localhost:11434/api/generate  https://api.deepseek.com/v1/chat/completions （对话补全）  https://wss.lke.cloud.tencent.com/v1/qbot/chat/sse (腾讯云-大模型知识引擎)
