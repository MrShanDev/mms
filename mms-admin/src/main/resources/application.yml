# =============================================================================
# mms-admin 主配置（各 profile 通过 application-{profile}.yml 叠加覆盖）
# 分段速览：sxpcwlkj / demo → captcha → server → spring → sa-token →
#          mybatis-plus → tenant → mms（plugin、cors、ai）→ websocket →
#          springdoc → encryption → sms → dromara.x-file-storage → wechat.bot
# =============================================================================

# ---------------------------------------------------------------------------
# 项目基础信息（展示名、版权、OpenAPI 文案等）
# ---------------------------------------------------------------------------
--- # 项目基础信息
sxpcwlkj:
  # 名称
  name: mmsAdmin
  # 描述（较长，springdoc.info.description 等与之一致时可复用文案）
  describe: 一款多模块化管理系统（Modular management system），简称：MMS，是一款基于多应用模块用户、商品、支付、订单、分销、日志、定时、通信、直播、广告、文章等多模块应用开源系统，可快速的应用与各类项目研发中，定期更新功能修复、上新、技术栈分享 (十年磨一剑，我们的目标是做最优价值的开源项目)！
  # 版本（与工程 revision 对齐时便于对外展示）
  version: "21"
  # 文档站点
  docUrl: https://www.mmsadmin.cn/
  # 版权年份
  copyrightYear: 2018
  # 机构 / 团队
  organization: 陕西品创网络

# ---------------------------------------------------------------------------
# 演示模式
# ---------------------------------------------------------------------------
# 与参数设置、部分写操作拦截相关
demo:
  mode:
    enabled: true                       # 默认开启演示模式
    message-template: "演示模式下禁止{operation}操作 [实体: {entity}, 方法: {method}]"
    allowed-users:                        # 白名单用户（不受演示拦截）
      - admin
    allowed-methods:                      # 白名单方法名
      - initSign
      - updateIpById

# ---------------------------------------------------------------------------
# 验证码
# ---------------------------------------------------------------------------
--- # 验证码配置
captcha:
  # 页面「参数设置」可开关验证码；类型：LINE / CIRCLE / SHEAR / CALCULATE
  type: LINE
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# ---------------------------------------------------------------------------
# 内嵌容器（Undertow）与 HTTP
# ---------------------------------------------------------------------------
--- # 环境配置（server）
server:
  # 服务端口（PowerJob 等可用 2${server.port} 派生辅助端口）
  port: 8080
  servlet:
    context-path: /
  undertow:
    # HTTP POST 体上限；-1 表示不限制
    max-http-post-size: -1
    # 单块缓冲区大小（字节）
    buffer-size: 512
    direct-buffers: true
    threads:
      # IO 线程（非阻塞）
      io: 8
      # Worker 线程（阻塞型 Servlet 等）
      worker: 256
  compression:
    enabled: true
    # 可按需扩展 mime-types；含 text/event-stream 便于 SSE
    mime-types: text/event-stream

# ---------------------------------------------------------------------------
# Spring 通用：应用名、profile、上传、Jackson、Thymeleaf、Web 放行
# ---------------------------------------------------------------------------
--- # Spring 配置
spring:
  application:
    name: mmsAdmin Admin
  messages:
    basename: i18n/messages
  profiles:
    active: dev
  servlet:
    multipart:
      # 插件 JAR 安装（如 /system/pluginHost/install）shade 包可达百余 MB
      max-file-size: 200MB
      max-request-size: 200MB
  threads:
    virtual:
      enabled: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      indent_output: false
      fail_on_empty_beans: false
    deserialization:
      fail_on_unknown_properties: false

  thymeleaf:
    enabled: true
    check-template: true
    check-template-location: true
    template-resolver-order: 1
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/template/html/
    suffix: .html
    servlet:
      content-type: text/html
    static:
      resource:
        version: '1.0.0'
        cdn: 'https://cdn.jsdelivr.net'

  web:
    is-open: true
    excludes:
      - /static/**,       # 静态资源
      - /public/**,       # 公共资源
      - /resources/**,    # 默认资源路径
      - /favicon.ico,     # 站点图标
      - /error            # 错误页
      - /.well-known/**

# ---------------------------------------------------------------------------
# Sa-Token：会话、JWT、匿名可访问路径
# ---------------------------------------------------------------------------
--- # Sa-Token 配置
sa-token:
  token-name: Authorization
  # 有效期（秒）；86400≈1 天；-1 表示永不过期
  timeout: 86400
  # 最低活跃间隔（秒）；超时未访问可冻结；-1 不冻结
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-read-header: true
  # Header 无 token 时是否继续从请求体参数读取
  is-read-body: true
  is-read-cookie: false
  # token-prefix: "Token_"
  jwt-secret-key: 01213456789abcdefghijklmnopqrstuvwxyz
  token-style: uuid
  is-log: false
  info-time-open: true

  excludes:
    - /
    - /error
    - /favicon.ico
    - /visitor/**
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /*/api-docs
    - /*/api-docs/**
    - /actuator
    - /actuator/**
    - /file/**
    - /ws/**
    - /swagger-ui/**
    # mms-doc 站点 API（mms-plugin-doc / docApi）
    - /doc/v1
    - /doc/v1/**

# ---------------------------------------------------------------------------
# MyBatis-Plus
# 文档：https://baomidou.com/pages/981406
# ---------------------------------------------------------------------------
--- # MyBatis-Plus 配置
mybatis-plus:
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  typeAliasesPackage: com.sxpcwlkj.**.entity
  checkConfigLocation: false
  configuration:
    mapUnderscoreToCamelCase: true
    callSettersOnNulls: true
    # NONE / PARTIAL / FULL
    autoMappingBehavior: PARTIAL
    # NONE / WARNING / FAILING
    autoMappingUnknownColumnBehavior: NONE
    # 生产可改为 NoLoggingImpl（见 application-prod.yml）
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    dbConfig:
      idType: ASSIGN_ID
      logicDeleteValue: 2
      logicNotDeleteValue: 0
      insertStrategy: NOT_NULL
      updateStrategy: NOT_NULL
      where-strategy: NOT_NULL

# ---------------------------------------------------------------------------
# 多租户（MyBatis 租户插件等）
# ---------------------------------------------------------------------------
--- # 多租户
tenant:
  enable: true
  exclusionTable:
    - sys_user_role
    - sys_user
    - sys_tenant_package
    - sys_tenant
    - sys_role_function
    - sys_role
    - sys_dept
    - sys_oss_config
    - sys_oss
    - sys_function
    - sys_dict_data
    - sys_dict
    - sys_config
    - sys_sign
    - sys_gen_table
    # 插件市场/宿主库表：业务固定 tenant_id=000000（PluginHostDbBridgeImpl.PLUGIN_REGISTRY_TENANT）；
    # 不排除时租户插件会追加「当前登录租户」，与 000000 叠加导致 UPDATE/SELECT 命中 0 行，停用无效并可能走全磁盘扫描重载。
    - sys_plugin_version
    - sys_plugins
    # mms-doc（mms-servers/mms-doc，@TableName）
    - doc_user
    - doc_order
    - doc_product
    - doc_config
    - doc_authorize_user
  column: tenant_id

# ---------------------------------------------------------------------------
# MMS：插件宿主、CORS、内置 AI 对话配置
# ---------------------------------------------------------------------------
--- # MMS 扩展（mms-plugin-host 等；磁盘布局见在线文档「JAR 插件」）
mms:
  plugin:
    enabled: true
    # 优先 MMS_PLUGIN_ROOT_DIR；未设置则 ${user.home}/mms/plugins
    root-dir: ${MMS_PLUGIN_ROOT_DIR:${user.home}/mms/plugins}
    # 与父 POM revision、插件描述符校验一致；可用 MMS_PLUGIN_HOST_MMS_REVISION
    host-mms-revision: ${MMS_PLUGIN_HOST_MMS_REVISION:21}
    # 0：在 Tomcat 请求线程执行 HOST_MVC（推荐）；>0：每插件独立池（易与 Sa-Token 线程语义冲突）
    plugin-mvc-per-plugin-pool-size: 0
  cors:
    allowed-origins: "*"
    allowed-headers: "*"
    allowed-methods: "*"
    allow-credentials: true
    max-age: 1800
  ai:
    # 对接类型：Ollama / DeepSeek / Document（如腾讯云知识引擎 LKE）
    type: Document
    # 示例：Ollama http://localhost:11434/api/generate；DeepSeek https://api.deepseek.com/v1/chat/completions；LKE 见下默认
    url: https://wss.lke.cloud.tencent.com/v1/qbot/chat/sse
    # ollama list 全名如 deepseek-r1:latest；LKE 可为空按厂商约定
    model: ''
    key: pjJLWvfdzAOdYINoefNLLjtmwNELHGtdFIESwJGtuCagfMGBQgudSrKgmPfdrlXDxAEwZuYsHkGxBhIVXKGBUAriwbEGhZPxyxkhuzxksXDeQcKDyijXDkAUOYmkNiFD
    context:
      max-turns: 5

# ---------------------------------------------------------------------------
# WebSocket
# ---------------------------------------------------------------------------
--- # WebSocket
websocket:
  enable: true
  allowed-origins: "*"

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI（生产 profile 可整体关闭，见 application-prod.yml）
# ---------------------------------------------------------------------------
--- # springdoc
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    # persistAuthorization: true
  group-configs:
    - group: 1.系统模块
      packages-to-scan: com.sxpcwlkj.system
    - group: 9.演示模块
      packages-to-scan: com.sxpcwlkj.demo
    - group: 8.插件宿主
      packages-to-scan: com.sxpcwlkj.plugin.host
  info:
    title: '标题：mmsAdmin多租户管理系统_接口文档'
    description: '描述：一款多模块化管理系统（Modular management system），简称：MMS，是一款基于多应用模块用户、商品、支付、订单、分销、日志、定时、通信、直播、广告、文章等多模块应用开源系统，可快速的应用与各类项目研发中，定期更新功能修复、上新、技术栈分享 (十年磨一剑，我们的目标是做最优价值的开源项目)！'
    version: '版本号: 21'
    contact:
      name: mmsAdmin
      email: sxpcwlkj@163.com
      url: https://gitee.com/mmsAdmin/mms
  components:
    security-schemes:
      apiKey:
        type: APIKEY
        in: HEADER
        name: Authorization

# ---------------------------------------------------------------------------
# 请求加解密
# ---------------------------------------------------------------------------
--- # 加密 / 解密
encryption:
  enable: true
  types:
    - AES
    - RSA
  valid-time: 3000
  repeated-time: 500

# ---------------------------------------------------------------------------
# 短信（多厂商配置常由 yaml / 库表加载）
# ---------------------------------------------------------------------------
--- # 短信
sms:
  config-type: yaml
  account-max: 4

# ---------------------------------------------------------------------------
# 对象存储（Dromara x-file-storage；具体平台多由库表动态加载）
# 文档：https://x-file-storage.xuyanwu.cn/#/快速入门
# ---------------------------------------------------------------------------
--- # 对象存储（dromara.x-file-storage）
dromara:
  x-file-storage:
    default-platform: ""
    aliyun-oss: []

