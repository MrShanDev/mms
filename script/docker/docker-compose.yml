version: '3.8'

services:
  mysql:
    image: mysql:8.0.31
    container_name: mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 初始化数据库(后续的初始化sql会在这个库执行)
      MYSQL_DATABASE: sxpcwlkj_mms
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      # 将mysql8.0默认密码策略 修改为 原先 策略 (mysql8.0对其默认策略做了更改 会导致密码无法匹配)
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    network_mode: "host"

  nginx-web:
    image: nginx:1.22.1
    container_name: nginx-web
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书映射
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  redis:
    image: redis:6.2.7
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/redis/conf:/redis/config:rw
      # 数据文件
      - /docker/redis/data/:/redis/data/:rw
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    network_mode: "host"

  # 品创网络-MMS
  mms-api-admin:
    image: sxpcwlkj/mms-api-admin:1.0.0
    container_name: mms-api-admin
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/sxpcwlkj/mms-api-admin/logs/:/sxpcwlkj/mms-api-admin/logs
      - /docker/sxpcwlkj/mms-api-admin/files/:/sxpcwlkj/mms-api-admin/files
    privileged: true
    network_mode: "host"

  # 品创网络-定时任务
  mms-powerjob:
    image: sxpcwlkj/mms-powerjob:1.0.0
    container_name: mms-powerjob
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/sxpcwlkj/mms-powerjob/logs/:/sxpcwlkj/mms-powerjob/logs
      - /docker/sxpcwlkj/mms-powerjob/files/:/sxpcwlkj/mms-powerjob/files
    privileged: true
    network_mode: "host"

  # 品创网络-监测
  mms-monitor:
    image: sxpcwlkj/mms-monitor:1.0.0
    container_name: mms-monitor
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/sxpcwlkj/mms-monitor/logs/:/sxpcwlkj/mms-monitor/logs
      - /docker/sxpcwlkj/mms-monitor/files/:/sxpcwlkj/mms-monitor/files
    privileged: true
    network_mode: "host"

