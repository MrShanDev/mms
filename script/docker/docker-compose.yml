version: '3.8'

# 定义自定义网络,所有服务通过此网络通信
networks:
  mms-network:
    driver: bridge

# 定义命名卷
volumes:
  rabbitmq_data:
    driver: local
  oracle_data:
    driver: local
  postgres_data:
    driver: local

services:
  # MySQL 8.0 数据库服务
  mysql:
    image: mysql:8.0.31
    container_name: mysql
    restart: unless-stopped  # 容器异常停止时自动重启
    environment:
      TZ: Asia/Shanghai  # 设置时区
      MYSQL_ROOT_PASSWORD: mms123@  # root用户密码
      MYSQL_DATABASE: mms  # 初始化数据库名
    ports:
      - "3306:3306"  # 映射数据库端口
    volumes:
      - /docker/mysql/data/:/var/lib/mysql/  # 数据持久化
      - /docker/mysql/conf/:/etc/mysql/conf.d/  # 配置文件
      # 首次启动时自动执行SQL脚本（将宿主机的SQL脚本目录挂载到容器初始化目录）
      # 使用方法：取消下面注释，MySQL首次启动时会按字母顺序执行 ../db/ 目录下的 .sql 和 .sh 文件
      # - ../db:/docker-entrypoint-initdb.d
    command:
      --default-authentication-plugin=mysql_native_password  # 使用传统密码认证
      --character-set-server=utf8mb4  # 字符集
      --collation-server=utf8mb4_general_ci  # 排序规则
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1  # 表名不区分大小写
    networks:
      - mms-network
    healthcheck:  # 健康检查，确保数据库就绪
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s  # 每10秒检查一次
      timeout: 5s
      retries: 5

  # Nginx Web服务器（反向代理）
  nginx-web:
    image: nginx:1.22.1
    container_name: nginx-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"  # HTTP端口
      - "443:443"  # HTTPS端口
    volumes:
      - /docker/nginx/cert:/etc/nginx/cert  # SSL证书目录
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf  # Nginx配置
      - /docker/nginx/html:/usr/share/nginx/html  # 静态资源
      - /docker/nginx/log:/var/log/nginx  # 日志目录
    networks:
      - mms-network
    depends_on:  # 等待后端服务启动
      - mms-admin

  # Redis 缓存服务
  redis:
    image: redis:6.2.7
    container_name: redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"  # Redis端口
    volumes:
      - /docker/redis/conf:/redis/config:rw  # Redis配置
      - /docker/redis/data/:/redis/data/:rw  # 数据持久化
    command: "redis-server /redis/config/redis.conf"  # 使用自定义配置启动
    networks:
      - mms-network
    healthcheck:  # 健康检查
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MMS 主应用服务（管理后台）
  mms-admin:
    image: sxpcwlkj/mms-admin:1.0.0
    container_name: mms-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod  # 激活生产环境配置
      # 数据库连接（注意：使用容器名mysql作为主机名）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: mms
      # Redis连接（使用容器名redis）
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 2
      SPRING_DATA_REDIS_PASSWORD: 123456
      # JVM内存设置
      JAVA_OPTS: -Xms512m -Xmx1024m
    ports:
      - "8080:8080"  # 主应用端口
    volumes:
      - /docker/sxpcwlkj/mms-admin/logs/:/sxpcwlkj/mms-admin/logs  # 日志目录
      - /docker/sxpcwlkj/mms-admin/files/:/sxpcwlkj/mms-admin/files  # 文件存储
    networks:
      - mms-network
    depends_on:  # 依赖服务必须健康才启动
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:  # 应用健康检查
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # 启动后60秒才开始检查

  # 低代码生成服务
  mms-generator:
    image: sxpcwlkj/mms-generator:1.0.0
    container_name: mms-generator
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: mms
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 2
      SPRING_DATA_REDIS_PASSWORD: 123456
      JAVA_OPTS: -Xms256m -Xmx512m  # 较小内存配置
    ports:
      - "8081:8080"  # 映射到8081避免冲突
    volumes:
      - /docker/sxpcwlkj/mms-generator/logs/:/sxpcwlkj/mms-generator/logs
      - /docker/sxpcwlkj/mms-generator/files/:/sxpcwlkj/mms-generator/files
    networks:
      - mms-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PowerJob 定时任务调度服务
  mms-powerjob:
    image: sxpcwlkj/mms-powerjob:1.0.0
    container_name: mms-powerjob
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: mms
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 2
      SPRING_DATA_REDIS_PASSWORD: 123456
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "7700:7700"  # PowerJob服务端口
      - "28080:28080"  # Worker端口
    volumes:
      - /docker/sxpcwlkj/mms-powerjob/logs/:/sxpcwlkj/mms-powerjob/logs
      - /docker/sxpcwlkj/mms-powerjob/files/:/sxpcwlkj/mms-powerjob/files
    networks:
      - mms-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 移动端API服务
  mms-mobile:
    image: sxpcwlkj/mms-mobile:1.0.0
    container_name: mms-mobile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: mms
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 2
      SPRING_DATA_REDIS_PASSWORD: 123456
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "8082:8080"  # 移动端API端口
    volumes:
      - /docker/sxpcwlkj/mms-mobile/logs/:/sxpcwlkj/mms-mobile/logs
      - /docker/sxpcwlkj/mms-mobile/files/:/sxpcwlkj/mms-mobile/files
    networks:
      - mms-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # EMQX MQTT消息服务器
  emqx:
    image: emqx/emqx:5.0.18
    container_name: emqx
    restart: always
    environment:
      TZ: Asia/Shanghai
      EMQX_LOADED_PLUGINS: "emqx_management,emqx_auth_http,emqx_dashboard"
      EMQX_DASHBOARD__DEFAULT_USER__LOGIN: mms
      EMQX_DASHBOARD__DEFAULT_USER__PASSWORD: mms123@
      EMQX_NODE__MAX_PORTS: 65535
      EMQX_MQTT__MAX_PACKET_SIZE: 16MB
    ports:
      - "1883:1883"    # MQTT端口
      - "8083:8083"    # MQTT/WebSocket端口
      - "8084:8084"    # MQTT/WebSocket SSL端口
      - "8883:8883"    # MQTT SSL端口
      - "18083:18083"  # EMQX Dashboard
    volumes:
      - /docker/emqx/log:/opt/emqx/log  # 日志目录
    networks:
      - mms-network

  # RabbitMQ 消息队列服务
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: mms
      RABBITMQ_DEFAULT_PASS: mms123@
    ports:
      - "5672:5672"    # 程序连接端口
      - "15672:15672"  # 管理界面端口
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq  # 数据持久化
    networks:
      - mms-network

  # 达梦数据库服务
  # 端口: 5236
  # 用户名: SYSDBA
  # 密码: SYSDBA001
  # 授权文件: 需将 dm.key 放置到 /docker/dmdb/license/ 目录下
  dmdb:
    image: xuxuclassmate/dameng
    container_name: dmdb
    restart: always
    privileged: true
    platform: linux/amd64  # M1 M2 arm64
    environment:
      TZ: Asia/Shanghai
      PAGE_SIZE: 16
      LD_LIBRARY_PATH: /opt/dmdbms/bin
      EXTENT_SIZE: 32
      LOG_SIZE: 1024
      UNICODE_FLAG: 1
      INSTANCE_NAME: DMSERVER
    ports:
      - "5236:5236"  # 达梦数据库端口
    volumes:
      - /docker/dmdb/data:/opt/dmdbms/data  # 数据持久化
      - /docker/dmdb/license:/opt/dmdbms/bin  # 授权文件挂载（将dm.key放到宿主机/docker/dmdb/license目录）
    networks:
      - mms-network

  # Oracle 数据库服务
  # 端口: 1521
  # 用户名: SYSTEM
  # 密码: Oradoc_db1
  # 服务名: XE
  oracle:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ORACLE_PWD: Oradoc_db1  # SYSTEM和SYS用户密码
      ORACLE_CHARACTERSET: AL32UTF8  # 字符集
    ports:
      - "1521:1521"  # Oracle数据库端口
      - "5500:5500"  # Oracle EM Express端口
    volumes:
      - oracle_data:/opt/oracle/oradata  # 数据持久化
    networks:
      - mms-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s SYSTEM/Oradoc_db1@//localhost:1521/XE"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Oracle启动较慢

  # PostgreSQL 数据库服务
  # 端口: 5432
  # 用户名: postgres
  # 密码: postgres123@
  # 数据库: mms
  postgresql:
    image: postgres:15.3
    container_name: postgresql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres  # 超级用户名
      POSTGRES_PASSWORD: postgres123@  # 超级用户密码
      POSTGRES_DB: mms  # 初始化数据库名
      PGDATA: /var/lib/postgresql/data/pgdata  # 数据目录
    ports:
      - "5432:5432"  # PostgreSQL端口
    volumes:
      - postgres_data:/var/lib/postgresql/data  # 数据持久化
    networks:
      - mms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
